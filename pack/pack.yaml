# ═══════════════════════════════════════════════════════════════════════════
#  우즈베키스탄 간호사 LMS 강의 — 분량·구조·말투 규격
#  ★ 도구와 프롬프트는 여기 숫자를 읽는다. 숫자를 프롬프트에 직접 적지 않는다.
# ═══════════════════════════════════════════════════════════════════════════
slug: uz-nurse
label: 우즈베키스탄 간호사 LMS 강의
audience: "우즈베키스탄 1~3년차 일반간호사(hamshira). 우즈벡어 음성·러시아어 자막으로 제작되며 이 한국어 원고는 마스터(L1)다."
input: _context/차시설계_입력_v1.xlsx

# ── 분량 (1강 = LMS 1 credit = 45분 동영상) ────────────────────────────────
chars_per_sec: 5.5            # 330자/분. summary-showcase · 원고집필가이드 실측
duration_min: 45              # 본문 코너만으로 45분
say_total: [15500, 17000]     # data-say 합계(공백 포함). 도입·정리 코너 포함
say_per_slide: [150, 300]     # 장당 낭독. 벗어나면 검수표가 잡는다
slides: [65, 80]              # h3 수(표지·마무리 제외)
body_block_chars: [2500, 4000]  # 본문 블록(=학습목표 1개) 낭독 합계
body_blocks: [3, 5]
sentence_max: 60              # 한 문장 60자 — 우즈벡어로 읽으면 8초 규칙(06 가이드)
new_terms_max: 10
quiz: [3, 5]                  # 문항 수. 낭독 없음

# ── 코너 (h2) — 순서 고정. 장 수는 스토리보드가 예산 안에서 정한다 ────────
corners:
  - {id: think,   name: 생각해보기,  slides: [1, 2], say: [300, 500]}
  - {id: goals,   name: 학습목표,    slides: [1, 1], say: [150, 250]}
  - {id: outline, name: 학습내용,    slides: [1, 1], say: [100, 200]}
  - {id: body,    name: 본문,        slides: [55, 70], say: [14000, 15500]}
  - {id: wrap,    name: 정리하기,    slides: [1, 2], say: [300, 500]}
  - {id: quiz,    name: 퀴즈,        slides: [3, 5], say: [0, 0]}
  - {id: refs,    name: 참고문헌,    slides: [1, 1], say: [0, 0]}

# ── 말투 ────────────────────────────────────────────────────────────────────
voice:
  tone: "구어체 존댓말. 결론을 먼저, 근거를 뒤에. 병동에서 선배가 옆에서 설명하듯."
  forbid: ["여러분", "정말", "놀랍게도", "혁신적인", "쉽게 말해서", "아시다시피", "당연히"]
  rules:
    - "한 문장 60자 이내. 접속사로 이어 붙이지 않는다."
    - "괄호를 쓰지 않는다 — 소리로 읽을 수 없다."
    - "숫자·단위·약어는 읽는 대로: '약 오 센티미터', '에스바'. 처음 나올 때 풀어 말한다."
    - "한국식 관용구·사자성어를 쓰지 않는다(번역이 깨진다)."
    - "화면 글과 낭독은 일부러 다르게. 화면은 표·그림·짧은 글, 낭독은 설명."
    - "화면 요소를 가리킬 때는 '화면의 표 두 번째 줄을 보십시오' 처럼 위치로 말한다."

# ── 현지화 ──────────────────────────────────────────────────────────────────
localize:
  tag: "[LOCALIZE: 종류 — 내용]"
  kinds: [법령, 기관, 통계, 기자재·약물, 단위, 프로토콜, 문화]
  rules:
    - "한국 기관명·법령명은 본문 낭독에 넣지 않는다. 필요하면 '일부 국가에서는' 으로 일반화하고 화면 출처 줄에만 적는다."
    - "우즈베키스탄 법령·보건부령은 조항 번호를 지어내지 않는다. '[LOCALIZE: 법령 — 현지 조항 확인]' 으로 남긴다."
    - "복장·성별 상호작용·종교(라마단, 돼지 유래 제품)·적신월 — 그림·예시에서 문화 점검."
    - "장비는 기본 병동 기자재를 전제한다. 시뮬레이터·VR·인퓨전 펌프는 '있는 경우' 로 말한다."

# ── 화면 ────────────────────────────────────────────────────────────────────
screen:
  size: "944 × 507px, 여섯 줄 이내"
  each_slide_has: "표(table) 또는 인라인 SVG(viewBox) 하나 이상. 줄글만 있는 장은 없다."
  svg_palette: ["#1F4E79", "#9DC3E6", "#334155", "#F6F1E8", "#2E75B6", "#CBD5E1"]
  source_line: "수치·지침이 있는 장은 몸통 끝에 <p class=\"src\">출처: …</p> 한 줄."
  image_prompt: "장마다 data-img 에 한국어 장면 지시 1~2문장. 16:9, 상단 10% 여백, 플랫 벡터, 라벨 4~6개, 얼굴·로고·한글 간판 없음."

footer: "교육용 원고 초안입니다. 현지 법령·지침 확인 전에는 공식 자료가 아닙니다."
